<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFT Bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <button class="nav-btn active" data-tab="profile">👤 Профиль</button>
    <button class="nav-btn" data-tab="roulette">🎰 Рулетка</button>
    <button class="nav-btn" data-tab="cases">🎁 Кейсы</button>
    <button class="nav-btn" data-tab="market">🛒 Рынок</button>
  </header>

  <main>
    <!-- ПРОФИЛЬ -->
    <section id="tab-profile" class="tab active">
      <div class="profile-header">
        <div class="avatar-container">
          <div class="orbiting-nfts" id="orbit-container"></div>
          <div class="avatar" id="avatar">👤</div>
        </div>
        <h2 id="username">Твой Ник</h2>
        <div id="premium-badge" class="badge hidden">👑 Premium</div>
        <div id="bio" class="bio">Описание профиля</div>
        <div class="uz-display" id="uz-text">Мой юз</div>
      </div>

      <div class="card">
        <h3>💰 Игровой баланс</h3>
        <div id="balance-game" class="big">0 ⭐</div>
      </div>

      <div class="card">
        <h3>🏆 Мои подарки</h3>
        <div id="my-nfts" class="grid"></div>
      </div>
    </section>

    <!-- РУЛЕТКА -->
    <section id="tab-roulette" class="tab">
      <div class="card" style="text-align:center;">
        <h2>🎰 Рулетка</h2>
        <div id="wheel-display" style="font-size: 60px; margin: 20px 0;">🎯</div>
        <button id="spin-btn" class="btn primary" onclick="spinWheel()">Крутить (100⭐)</button>
      </div>
    </section>

    <!-- КЕЙСЫ -->
    <section id="tab-cases" class="tab">
      <h2>🎁 Кейсы NFT</h2>
      <div id="cases-grid" class="grid"></div>
    </section>

    <!-- РЫНОК -->
    <section id="tab-market" class="tab">
      <h2>🛒 Рынок</h2>
      <div id="market-grid" class="grid"></div>
    </section>
  </main>
</div>

<!-- МОДАЛЬНОЕ ОКНО NFT (КАК В ТГ) -->
<div id="modal-nft" class="modal hidden">
  <div class="modal-content nft-modal">
    <div class="nft-bg-preview" id="nft-preview-bg">
      <div id="nft-preview-emoji" style="font-size: 100px;">🎁</div>
    </div>
    <h2 id="nft-preview-name">Мишка</h2>
    <div id="nft-preview-rarity" class="rarity-tag">Обычный</div>
    <div class="nft-info">
      <div>Номер: <b id="nft-preview-number">#1</b></div>
      <div>Примерная цена: <b id="nft-preview-price">100</b> ⭐</div>
    </div>
    
    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn primary" style="flex:1;" onclick="upgradeNft()">✨ Улучшить</button>
        <button class="btn" style="flex:1; background: #e74c3c;" onclick="sellNft()">💰 Продать</button>
    </div>
    
    <button class="btn" style="margin-top: 15px; background: #333;" onclick="closeModal('modal-nft')">Закрыть</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
