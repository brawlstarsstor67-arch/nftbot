<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NFT Casino Mini</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Шапка с балансом -->
  <div class="top-bar">
    <div class="graffiti-header">NFT CASINO</div>
    <div class="balance-box" onclick="toggleStarsPicker()">
      <span class="star">⭐</span>
      <span id="bal">0</span>
      <span class="plus">+</span>
    </div>
  </div>

  <!-- Навигация -->
  <nav class="glass-nav">
    <button class="glass-btn" data-tab="roulette" onclick="go('roulette')">🎰 Рулетка</button>
    <button class="glass-btn" data-tab="cases" onclick="go('cases')">🎁 Кейсы</button>
    <button class="glass-btn" data-tab="inv" onclick="go('inv')">💎 Инвентарь</button>
    <button class="glass-btn" data-tab="upg" onclick="go('upg')">⬆️ Апгрейдер</button>
    <button class="glass-btn" data-tab="market" onclick="go('market')">🛒 Рынок</button>
    <button class="glass-btn" data-tab="prof" onclick="go('prof')">👤 Профиль</button>
  </nav>

  <!-- Основной экран -->
  <div id="view"></div>

  <!-- Поп-апы: звёзды, цвет, тема, промокод -->
  <div id="stars-picker" class="card" style="display:none; text-align:center;">
    <h3>Пополнение</h3>
    <p>Выберите количество звёзд:</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <button class="mini" onclick="buyPackOpen(50)">50 ⭐</button>
      <button class="mini" onclick="buyPackOpen(150)">150 ⭐</button>
      <button class="mini" onclick="buyPackOpen(500)">500 ⭐</button>
    </div>
    <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:16px 0;" />
    <input id="promo" type="text" placeholder="Промокод" />
    <button class="ok-btn" onclick="claimPromo()">Активировать</button>
    <button class="btn-glass" onclick="toggleStarsPicker()" style="margin-top:8px;">Закрыть</button>
  </div>

  <div id="color-picker" class="card" style="display:none; text-align:center;">
    <h3>Цвет акцента</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <button class="mini" style="background:#ffd700; color:#000;" onclick="setColor('#ffd700')">Золото</button>
      <button class="mini" style="background:#ff4757; color:#fff;" onclick="setColor('#ff4757')">Красный</button>
      <button class="mini" style="background:#2ed573; color:#fff;" onclick="setColor('#2ed573')">Зелёный</button>
      <button class="mini" style="background:#1e90ff; color:#fff;" onclick="setColor('#1e90ff')">Синий</button>
      <button class="mini" style="background:#a450e6; color:#fff;" onclick="setColor('#a450e6')">Фиолетовый</button>
    </div>
    <button class="btn-glass" onclick="toggleColorPicker()" style="margin-top:12px;">Закрыть</button>
  </div>

  <div id="theme-picker" class="card" style="display:none; text-align:center;">
    <h3>Тема оформления</h3>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
      <button class="mini" onclick="setTheme('default')">Стандартная</button>
      <button class="mini" onclick="setTheme('xmas')">Новогодняя</button>
      <button class="mini" onclick="setTheme('halloween')">Хэллоуин</button>
      <button class="mini" onclick="setTheme('chinese')">Китайский Новый год</button>
    </div>
    <button class="btn-glass" onclick="toggleThemePicker()" style="margin-top:12px;">Закрыть</button>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
