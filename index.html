<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NFT CASINO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="graffiti-header">NFT CASINO</header>

<div class="top-bar">
  <div class="balance-box">
    <span class="star">⭐</span>
    <span id="bal">0</span>
  </div>
  <div class="theme-controls">
    <button class="btn-glass mini" onclick="toggleColorPicker()">🎨</button>
    <button class="btn-glass mini" onclick="toggleThemePicker()">🎇</button>
  </div>
</div>

<nav class="glass-nav">
  <button class="glass-btn" data-tab="roulette" onclick="go('roulette')">🎰 Рулетка</button>
  <button class="glass-btn" data-tab="cases"    onclick="go('cases')">🎁 Кейсы</button>
  <button class="glass-btn" data-tab="market"   onclick="go('market')">🛍️ Рынок</button>
  <button class="glass-btn" data-tab="inv"      onclick="go('inv')">💎 NFT</button>
  <button class="glass-btn" data-tab="upg"      onclick="go('upg')">⬆️ Апгрейд</button>
  <button class="glass-btn" data-tab="prof"     onclick="go('prof')">👤 Профиль</button>
</nav>

<main id="view"></main>

<div id="color-picker" class="popup glass-panel">
  <h3>🎨 Цвет оформления</h3>
  <div class="color-grid">
    <button class="color-btn" style="background:#ffd700" onclick="setColor('#ffd700')"></button>
    <button class="color-btn" style="background:#ff3b30" onclick="setColor('#ff3b30')"></button>
    <button class="color-btn" style="background:#5ac8fa" onclick="setColor('#5ac8fa')"></button>
    <button class="color-btn" style="background:#8e8e93" onclick="setColor('#8e8e93')"></button>
    <button class="color-btn" style="background:#1c1c1e" onclick="setColor('#ffffff')"></button>
    <button class="color-btn" style="background:#d4af37" onclick="setColor('#d4af37')"></button>
    <button class="color-btn" style="background:#8b5a2b" onclick="setColor('#8b5a2b')"></button>
    <button class="color-btn" style="background:#34c759" onclick="setColor('#34c759')"></button>
    <button class="color-btn" style="background:#af52de" onclick="setColor('#af52de')"></button>
  </div>
  <button class="btn-glass" onclick="toggleColorPicker()">Закрыть</button>
</div>

<div id="theme-picker" class="popup glass-panel">
  <h3>🎇 Быстрая тема</h3>
  <div class="theme-list">
    <button class="theme-btn" onclick="setTheme('default')">🌑 Обычная</button>
    <button class="theme-btn" onclick="setTheme('xmas')">🎄 Новый год</button>
    <button class="theme-btn" onclick="setTheme('halloween')">🎃 Хеллоуин</button>
    <button class="theme-btn" onclick="setTheme('chinese')">🏮 Китайский НГ</button>
  </div>
  <button class="btn-glass" onclick="toggleThemePicker()">Закрыть</button>
</div>

<script src="app.js"></script>
</body>
</html>
